name: subtitle-translate

# 日文语音视频 → 日文 SRT 字幕(纯云端, 只做 ASR: 不翻译、不调 LLM、不烧录)
#   分片按「番号」归组 → ffmpeg 拼整片 → faster-whisper 日文转写
#   → 按分片切时间轴, 每个视频文件出同名 .srt 上传回源目录
#
# 公开仓库: 日志全部脱敏(logmask), 真实盘名/目录名/番号/链接均不出现明文。
# Secrets: GITRCLONE_CONF(含源远端) / GITPATHS_JSON(SUB_SRC/SUB_DIR) / YDY_DAV_TOKEN
# 2026-11-21: 中译链路 / 硬字幕烧制 / 修复模式 已从脚本整体删除;
#             SUBTITLE_API_* / SUBTITLE_MODEL* / BURN_* / LANG_MODE 全部不再注入。

on:
  # 兜底定时(每 2 小时): 主调度走 subtitle-dispatch(每 10 分钟补满并行)。
  # 已有 srt 的组自动跳过(幂等), 所以每次都取当前最前面的未处理组。
  schedule:
    # 错峰: 挪到 :23 —— 账号内 gen-manifest/in-pipeline/gd6-ydy2-* 等一批 */3、*/4、*/6
    #       定时任务都在 :00 起跑, 0 点与 12 点最挤; :23 全账号无冲突。
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "true=真跑(转写+上传 srt), false=只列分组统计"
        required: false
        default: "false"
      only:
        description: "只处理某一组(按番号, 留空=全部)"
        required: false
        default: ""
      limit_groups:
        description: "最多处理前 N 组(0=不限)"
        required: false
        default: "1"
      budget_min:
        description: "本轮时间预算(分钟)"
        required: false
        default: "300"
      whisper_model:
        description: "whisper 模型(large-v3-turbo / turbo / large-v3 / medium / small); 默认 large-v3"
        required: false
        default: "large-v3"
      probe_only:
        description: "验证用: 只转写前 N 秒(如 120), 不上传; 0=正常全量"
        required: false
        default: "0"
      batch_tag:
        description: "批次标识(仅用于并发分组, 留空=用 run_id)"
        required: false
        default: ""
      start_index:
        description: "从待处理列表第 K 个开始(并行分批); 配合 limit_groups 划分区间"
        required: false
        default: "0"
      force:
        description: "配合 only: 即使已有 srt 也强制重跑(测试用, 慎用)"
        required: false
        default: "false"

concurrency:
  # 按 batch_tag 唯一, 允许多批并行跑不同组(不会互相取消); cancel-in-progress 仍关
  group: subtitle-translate-${{ inputs.batch_tag || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PATHS_JSON: ${{ secrets.GITPATHS_JSON }}
  # --- 纯日文识别: 无 LLM / 无烧录, 只剩 whisper 本地推理旋钮 ---
  WHISPER_THREADS: ${{ vars.WHISPER_THREADS || '4' }}
  WHISPER_BATCH: ${{ vars.WHISPER_BATCH || '8' }}     # 批量推理批大小(旧: 无)
  WHISPER_BEAM: ${{ vars.WHISPER_BEAM || '1' }}       # 1=贪心最快, 5=束搜索更准

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 取仓库
        uses: actions/checkout@v4

      - name: 装 ffmpeg
        # 不走 apt(20 个 job 同时 apt-get 会互相拖); 镜像自带就跳过
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "镜像自带 ffmpeg, 跳过安装"
            ffmpeg -version | head -1
            exit 0
          fi
          echo "镜像里没有 ffmpeg, 先试 BtbN 的 GitHub 静态构建"
          ok=0
          if curl -fsSL --retry 3 --retry-delay 3 --retry-all-errors \
               -o /tmp/ff.tar.xz \
               https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
             && sudo mkdir -p /opt/ff \
             && sudo tar -xJf /tmp/ff.tar.xz -C /opt/ff --strip-components=1; then
            ff=$(sudo find /opt/ff -type f -name ffmpeg | head -1)
            fp=$(sudo find /opt/ff -type f -name ffprobe | head -1)
            if [ -n "$ff" ] && [ -n "$fp" ]; then
              sudo ln -sf "$ff" /usr/local/bin/ffmpeg
              sudo ln -sf "$fp" /usr/local/bin/ffprobe
              ok=1
            fi
          fi
          if [ "$ok" != "1" ]; then
            echo "静态包也没成, 退回 apt"
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: 装 rclone
        run: |
          curl -s https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/r.zip
          unzip -q -o /tmp/r.zip -d /tmp
          cp /tmp/rclone-*/rclone /usr/local/bin/
          rclone version | head -1

      - name: 写 rclone 配置
        env:
          RCLONE_CONF: ${{ secrets.GITRCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          test -s ~/.config/rclone/rclone.conf && echo "rclone 配置已写入"
          grep -E '^\[' ~/.config/rclone/rclone.conf | sed 's/$/: <masked>/'

      - name: 追加 ydy2(139 个人云) WebDAV 远端
        env:
          YDY_DAV_TOKEN: ${{ secrets.YDY_DAV_TOKEN }}
        run: |
          printf '\n[ydy2]\ntype = webdav\nurl = https://abcd.tammader.de5.net/dav/ydy2\nvendor = other\nbearer_token = %s\n' "$YDY_DAV_TOKEN" >> ~/.config/rclone/rclone.conf
          rclone listremotes
          rclone lsd ydy2: --max-depth 1 | head -5

      - name: 装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 缓存 pip 与 whisper 模型权重
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: sub-${{ runner.os }}-pip-hf-v1

      - name: 装 faster-whisper
        run: |
          python3 -m pip install --quiet --upgrade pip
          # 三件套用近期自洽版本:
          #   av>=14 (有 cp311 wheel, 且 <19 避免 metadata_errors 旧坑)
          #   ctranslate2>=4.5 (修 4.4.0 的 execstack "cannot enable executable stack" bug)
          #   faster-whisper 1.2.x 官方支持上述组合
          python3 -m pip install --quiet "av==18.1.0" "ctranslate2==4.8.5" "faster-whisper==1.2.1"
          python3 -c "import faster_whisper, av, ctranslate2; print('fw', faster_whisper.__version__, '| av', av.__version__, '| ct2', ctranslate2.__version__)"

      - name: 跑字幕流水线(只出日文 srt)
        env:
          EVENT_NAME: ${{ github.event_name }}
          APPLY: ${{ inputs.apply || 'false' }}
          ONLY: ${{ inputs.only || '' }}
          LIMIT_GROUPS: ${{ inputs.limit_groups || '1' }}
          BUDGET_MIN: ${{ inputs.budget_min || '300' }}
          WHISPER_MODEL: ${{ inputs.whisper_model || 'large-v3' }}
          PROBE_ONLY: ${{ inputs.probe_only || '0' }}
          START_INDEX: ${{ inputs.start_index || '0' }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -e
          # 定时触发(schedule)没有 inputs: 强制真跑一批
          if [ "$EVENT_NAME" = "schedule" ]; then
            APPLY="true"; LIMIT_GROUPS="3"; START_INDEX="0"; ONLY=""
            echo "(定时触发: 处理 3 组日文转写)"
          fi
          ARGS="--limit-groups $LIMIT_GROUPS --budget-min $BUDGET_MIN --start-index $START_INDEX"
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; fi
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
          if [ "$PROBE_ONLY" != "0" ]; then ARGS="$ARGS --probe-only $PROBE_ONLY"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          python3 gitsubtitle_translate.py $ARGS

      - name: 磁盘余量
        if: always()
        run: df -h / | tail -1

      # 自接力(限量): 本批结束补 1 批, 避免 GitHub cron 不守时导致断流。
      # RELAY=1 -> dispatch 每次最多补 1 批, 不会指数级联。
      # !cancelled(): 被取消的 run 不许再自接力(2026-11-18 实测: 取消 20 批 -> 瞬间多出 ~50 批重复)
      # 探针模式(probe_only)也不接力, 否则一次验证会顺带放出一批全量。
      - name: 自接力补一批
        if: ${{ !cancelled() && (inputs.probe_only || '0') == '0' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITGH_TOKEN }}
          PATHS_JSON: ${{ secrets.GITPATHS_JSON }}
          RELAY: "1"
        run: |
          sleep $((RANDOM % 40))
          python3 gitsubtitle_dispatch.py
